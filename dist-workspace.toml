[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
plan-jobs = ["./release-check"]
local-artifacts-jobs = ["./freebsd"]
global-artifacts-jobs = ["./verify-artifacts"]
publish-jobs = ["./publish-homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Retain the upstream palette notices in binary releases as well as the source.
include = ["src/tui/THEMES.md", "src/tui/licenses"]
# Produce GitHub provenance attestations for release artifacts
github-attestations = true
# Attest all archives (including additional FreeBSD assets) after verification.
# PR rehearsals do not need publishing credentials or OIDC tokens.
github-attestations-phase = "host"
# Exercise artifact handoff and native verification on PRs without publishing.
pr-run-mode = "upload"

# FreeBSD uses native VM builds. Register the resulting archives as additional
# assets, without scheduling cargo-dist's Linux cross-builder for these targets.
# The generated shell installer still handles only the macOS/Linux targets above.
[[dist.extra-artifacts]]
build = ["python3", "scripts/freebsd_release.py", "collect", "--staged-inputs"]
artifacts = [
  "target/freebsd/fmn-x86_64-unknown-freebsd.tar.xz",
  "target/freebsd/fmn-x86_64-unknown-freebsd.tar.xz.sha256",
  "target/freebsd/fmn-aarch64-unknown-freebsd.tar.xz",
  "target/freebsd/fmn-aarch64-unknown-freebsd.tar.xz.sha256",
]

[dist.github-custom-job-permissions.freebsd]
contents = "read"

[dist.github-custom-job-permissions.release-check]
contents = "read"

[dist.github-custom-job-permissions.publish-homebrew]
contents = "read"

[dist.github-custom-job-permissions.verify-artifacts]
contents = "read"
