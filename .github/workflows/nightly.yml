name: Extended tests

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/importer
            target: FuzzNativeHistory
          - package: ./cmd/fmn
            target: FuzzConfig
          - package: ./internal/search
            target: FuzzPattern
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -mod=readonly "$PACKAGE" -run '^$' -fuzz "^$TARGET$" -fuzztime 5m
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}

  stress:
    name: SQLite concurrency stress
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -mod=readonly -count=20 -run TestConcurrent ./internal/history
