name: Verify release binaries

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: release
      - name: Verify checksum and run the packaged binary
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          archive="fmn-${TARGET}.tar.xz"
          shasum -a 256 --check "$archive.sha256"
          tar -xf "$archive"
          binary="./fmn-${TARGET}/fmn"
          test "$("$binary" --version)" = "fmn ${RELEASE_TAG#v}"
          FMN_DATA_DIR="$RUNNER_TEMP/fmn-smoke-history" \
            FMN_CONFIG="$RUNNER_TEMP/fmn-smoke-config.toml" "$binary" doctor
