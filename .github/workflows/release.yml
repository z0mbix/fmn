name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Choose the binary version
        id: version
        run: |
          version=go-dev
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" = go-dev ]; then exit 1; fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Cross-compile and package the six targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 bin/release.py build --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: fmn-release-archives
          path: bin/dist/
          if-no-files-found: error

  verify:
    needs: build
    uses: ./.github/workflows/verify-artifacts.yml
    with:
      version: ${{ needs.build.outputs.version }}

  custom-freebsd:
    needs: build
    uses: ./.github/workflows/verify-freebsd.yml
    with:
      version: ${{ needs.build.outputs.version }}

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, build, verify, custom-freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fmn-release-archives
          path: release
      - name: Attest the verified archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/fmn-*.tar.xz
      - name: Publish release
        run: |
          args=()
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes "${args[@]}"

  homebrew:
    needs: publish
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
