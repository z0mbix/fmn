name: Verify FreeBSD archives

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: FreeBSD ${{ matrix.release }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        release: ['15.0', '15.1']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            target: x86_64-unknown-freebsd
          - arch: aarch64
            target: aarch64-unknown-freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: fmn-release-archives
          path: release
      - name: Verify the archive on the FreeBSD 15.0 base system
        if: matrix.release == '15.0'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: TARGET VERSION
          copyback: false
          run: |
            set -eu
            freebsd-version
            uname -m
            archive="release/fmn-$TARGET.tar.xz"
            test "$(sha256 -q "$archive")" = "$(awk 'NR == 1 { print $1 }' "$archive.sha256")"
            smoke=$(mktemp -d)
            trap 'rm -rf "$smoke"' EXIT
            tar -xf "$archive" -C "$smoke"
            binary="$smoke/fmn-$TARGET/fmn"
            file "$binary" | grep -F 'statically linked'
            export FMN_DATA_DIR="$smoke/history" FMN_CONFIG="$smoke/config.toml"
            test "$("$binary" --version)" = "fmn $VERSION"
            "$binary" doctor
            printf '%s' 'echo release-smoke' | "$binary" _record-start \
              --shell bash --session release-smoke --cwd "$smoke" --started-at 1700000000000
            "$binary" _record-finish --session release-smoke --exit-code 7 --finished-at 1700000000100
            entries=$("$binary" history list --json)
            printf '%s\n' "$entries" | grep -Fq '"command": "echo release-smoke"'
            printf '%s\n' "$entries" | grep -Fq '"exit_code": 7'
      - name: Run CLI and shell tests against the archive on FreeBSD 15.1
        if: matrix.release == '15.1'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: TARGET VERSION
          copyback: false
          prepare: |
            set -eu
            pkg install -y python3 fish zsh bash expect git
            sqlite_package=$(/usr/local/bin/python3 -c 'import sys; print(f"py{sys.version_info.major}{sys.version_info.minor}-sqlite3")')
            pkg install -y "$sqlite_package"
          run: |
            set -eu
            export PATH="/usr/local/bin:/usr/local/sbin:$PATH"
            freebsd-version
            uname -m
            python3 bin/release.py verify --target "$TARGET" --version "$VERSION" --directory release
            tar -xf "release/fmn-$TARGET.tar.xz" -C release
            export FMN_TEST_BIN="$PWD/release/fmn-$TARGET/fmn"
            python3 -m unittest discover -s tests -p 'test_*.py'

  qualify:
    # Main's ruleset requires this check name under the custom-freebsd caller.
    name: FreeBSD qualification
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.verify.result }}
    steps:
      - name: Require every FreeBSD runtime check
        run: |
          if [ "$RESULT" != success ]; then
            printf 'FreeBSD verification result: %s\n' "$RESULT" >&2
            exit 1
          fi
