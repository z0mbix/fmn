[package]
name = "fmn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, local-first shell history manager"
license = "MIT"
repository = "https://github.com/z0mbix/fmn"
homepage = "https://github.com/z0mbix/fmn"
readme = "README.md"
keywords = ["shell", "history", "tui", "fish", "sqlite"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
globset = "0.4"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
# rusqlite 0.40 requires Rust 1.95's cfg_select! macro.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
criterion = "0.8"
predicates = "3"
proptest = "1"
tempfile = "3"

[[bench]]
name = "history"
harness = false

[profile.release]
lto = "thin"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
