[package]
name = "fmn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, local-first shell history manager"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
globset = "0.4"
nucleo-matcher = "0.3.1"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
